{% extends "base.html" %}

{% block title %}提醒 - Personal Life OS{% endblock %}
{% block mobile_title %}提醒{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">

    <!-- ========== 添加提醒 ========== -->
    <div class="bg-white rounded-2xl shadow-lg p-4 md:p-6 mb-6 card-hover">
        <form hx-post="{{ url_for('add_reminder') }}" hx-target="#reminder-list" hx-swap="afterbegin"
            hx-on::after-request="this.reset()">

            <div class="flex flex-col gap-3">
                <input type="text" name="title" required placeholder="提醒标题..."
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500">

                <div class="flex flex-col md:flex-row gap-3">
                    <input type="datetime-local" name="target_datetime" required
                        class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500">

                    <button type="submit"
                        class="px-6 py-3 bg-primary-600 text-white font-medium rounded-xl hover:bg-primary-700 transition-colors shadow-md">
                        <i class="fas fa-bell mr-2"></i>
                        创建提醒
                    </button>
                </div>

                <textarea name="description" placeholder="备注说明 (可选)" rows="2"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-primary-500"></textarea>
            </div>
        </form>
    </div>

    <!-- ========== 操作栏 ========== -->
    <div class="flex items-center justify-between mb-4">
        <!-- 测试通知按钮 -->
        <button type="button" onclick="testNotification()"
            class="flex items-center gap-2 px-3 py-1.5 text-sm text-primary-600 bg-primary-50 rounded-lg hover:bg-primary-100 transition-colors">
            <i class="fas fa-bell"></i>
            测试通知
        </button>

        <!-- 显示已完成开关 -->
        <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
            <input type="checkbox" {% if show_done %}checked{% endif %}
                onchange="window.location.href='{{ url_for('reminders') }}?show_done=' + (this.checked ? 'true' : 'false')"
                class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500">
            显示已完成
        </label>
    </div>

    <!-- ========== 提醒列表 ========== -->
    <div id="reminder-list" class="space-y-3">
        {% for reminder in reminders %}
        {% include 'partials/reminder_item.html' %}
        {% else %}
        <div class="text-center py-12 text-gray-400">
            <i class="fas fa-bell-slash text-4xl mb-3"></i>
            <p>还没有任何提醒</p>
            <p class="text-sm">设置一个提醒，不再错过重要事项！</p>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
