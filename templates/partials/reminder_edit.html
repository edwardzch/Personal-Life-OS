<!-- 提醒编辑表单 (HTMX 局部替换) -->
<div class="bg-white rounded-xl p-4 shadow-sm border-2 border-primary-500 animate-fade-in"
    id="reminder-{{ reminder.id }}">
    <form hx-post="{{ url_for('edit_reminder', id=reminder.id) }}" hx-target="#reminder-{{ reminder.id }}"
        hx-swap="outerHTML">

        <input type="text" name="title" value="{{ reminder.title }}" required placeholder="提醒标题..."
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 mb-3"
            autofocus>

        <input type="datetime-local" name="target_datetime"
            value="{{ reminder.target_datetime.strftime('%Y-%m-%dT%H:%M') }}" required
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 mb-3">

        <textarea name="description" placeholder="备注说明 (可选)" rows="2"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-primary-500 mb-3">{{ reminder.description or '' }}</textarea>

        <div class="flex justify-end gap-2">
            <button type="button" onclick="location.reload()"
                class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                取消
            </button>
            <button type="submit"
                class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                <i class="fas fa-check mr-1"></i> 保存
            </button>
        </div>
    </form>
</div>
