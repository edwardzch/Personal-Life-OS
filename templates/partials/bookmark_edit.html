<!-- 书签编辑表单 (HTMX 局部替换) -->
<div class="bg-white rounded-xl shadow-sm border-2 border-primary-500 animate-fade-in overflow-hidden"
    id="bookmark-{{ bookmark.id }}">
    <div class="h-1 bg-primary-400"></div>

    <div class="p-4">
        <form hx-post="{{ url_for('edit_bookmark', id=bookmark.id) }}" hx-target="#bookmark-{{ bookmark.id }}"
            hx-swap="outerHTML">

            <input type="url" name="url" value="{{ bookmark.url }}" required placeholder="网址..."
                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 mb-3"
                autofocus>

            <input type="text" name="title" value="{{ bookmark.title or '' }}" placeholder="标题..."
                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 mb-3">

            <textarea name="description" placeholder="备注说明 (可选)" rows="2"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-primary-500 mb-3">{{ bookmark.description or '' }}</textarea>

            <div class="flex justify-end gap-2">
                <button type="button" onclick="location.reload()"
                    class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                    取消
                </button>
                <button type="submit"
                    class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                    <i class="fas fa-check mr-1"></i> 保存
                </button>
            </div>
        </form>
    </div>
</div>
