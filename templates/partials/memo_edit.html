<!-- 速记编辑表单 (HTMX 局部替换) -->
<div class="bg-white rounded-xl p-4 shadow-sm border-2 border-primary-500 animate-fade-in" id="memo-{{ memo.id }}">
    <form hx-post="{{ url_for('edit_memo', id=memo.id) }}" hx-target="#memo-{{ memo.id }}" hx-swap="outerHTML">

        <textarea name="content"
            class="w-full min-h-[100px] p-3 border border-gray-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-primary-500"
            autofocus>{{ memo.content }}</textarea>

        <input type="text" name="tags" value="{{ memo.tags or '' }}" placeholder="标签 (逗号分隔)"
            class="w-full mt-2 px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">

        <div class="flex justify-end gap-2 mt-3">
            <button type="button" hx-get="{{ url_for('edit_memo', id=memo.id) }}" hx-target="#memo-{{ memo.id }}"
                hx-swap="outerHTML" hx-headers='{"HX-Cancel": "true"}' onclick="location.reload()"
                class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                取消
            </button>
            <button type="submit"
                class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                <i class="fas fa-check mr-1"></i> 保存
            </button>
        </div>
    </form>
</div>
